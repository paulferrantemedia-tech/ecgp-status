document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"8e0ab72d-7030-4588-8887-deedc34d623e\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  body { margin:0; background:#0A0A0A; color:#FFFFFF; font-family:\"Helvetica Neue\",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }\n  a { color:#00F2EA; text-decoration:none; }\n  a:hover { color:#FFFFFF; text-decoration:underline; }\n  ::selection { background:#00F2EA; color:#0A0A0A; }\n  input[type=text], input[type=date] { font-family:inherit; }\n  table { border-collapse:collapse; }\n<\u002Fstyle>\n<script src=\"4d266bed-510f-436f-9383-7e3caa079e62\"><\u002Fscript>\n<script src=\"cca24f4c-640f-481f-a498-fc77a3c32443\"><\u002Fscript>\n<\u002Fhelmet>\n\n\n\n<sc-if value=\"{{ locked }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"position:fixed;inset:0;z-index:9999;background:#0A0A0A;display:flex;align-items:center;justify-content:center;padding:32px\">\n    <div style=\"width:100%;max-width:392px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <img src=\"fda07597-36f3-450d-bc67-a4182b56485c\" alt=\"\" width=\"2590\" height=\"2188\" style=\"display:block;width:44px;height:auto;flex:0 0 auto\">\n        <div>\n          <div style=\"font-size:17px;font-weight:700;letter-spacing:-0.01em;line-height:1.15;color:#FFFFFF\">Entertainment<\u002Fdiv>\n          <div style=\"font-size:17px;font-weight:700;letter-spacing:-0.01em;line-height:1.15;color:#00F2EA\">Creator Growth Program<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"height:1px;background:#1F1F1F\"><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#8A8A8A\">Restricted · internal only<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.55;color:#B4B4B4;text-wrap:pretty\">This ops board contains creator-level data. Add your name and the passphrase to continue — status changes are attributed to you.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <input type=\"text\" value=\"{{ nameVal }}\" sc-camel-on-change=\"{{ onNameInput }}\" sc-camel-on-key-down=\"{{ onPwKey }}\" placeholder=\"Your name\" style=\"width:100%;box-sizing:border-box;background:#141414;border:1px solid #2A2A2A;border-radius:8px;padding:12px 14px;font:inherit;font-size:14px;color:#FFFFFF;outline:none\" style-focus=\"border-color:#00F2EA\">\n        <input type=\"password\" value=\"{{ pwVal }}\" sc-camel-on-change=\"{{ onPwInput }}\" sc-camel-on-key-down=\"{{ onPwKey }}\" placeholder=\"Passphrase\" sc-camel-auto-focus=\"{{ true }}\" style=\"width:100%;box-sizing:border-box;background:#141414;border:1px solid #2A2A2A;border-radius:8px;padding:12px 14px;font:inherit;font-size:14px;color:#FFFFFF;outline:none\" style-focus=\"border-color:#00F2EA\">\n        <sc-if value=\"{{ pwErr }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12px;color:#FF4D6A\">{{ pwErr }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ onUnlock }}\" style=\"width:100%;background:#00F2EA;border:none;border-radius:8px;padding:12px 14px;font:inherit;font-size:14px;font-weight:600;color:#0A0A0A;cursor:pointer;transition:background 160ms cubic-bezier(0.2,0,0,1)\" style-hover=\"background:#4DF6F0\">Unlock board<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size:11px;line-height:1.5;color:#6A6A6A\">Do not forward this link or the passphrase outside the program team.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"min-width:1080px;padding:28px 32px 64px;display:flex;flex-direction:column;gap:20px;background:#0A0A0A\">\n\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:32px p:pretty\">{{ snap.tierNote }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ snap.hasFootnotes }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top:26px;border-top:1px solid #262626;padding-top:16px;display:flex;flex-direction:column;gap:7px\">\n            <sc-for list=\"{{ snap.footnotes }}\" as=\"f\" hint-placeholder-count=\"3\">\n              <div style=\"font-size:11px;color:#8A8A8A;line-height:1.55;text-wrap:pretty\">{{ f }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"margin-top:26px;border-top:1px solid #262626;padding-top:14px;display:flex;flex-direction:column;gap:5px\">\n          <sc-for list=\"{{ snap.provenance }}\" as=\"p\" hint-placeholder-count=\"4\">\n            <div style=\"font-size:10px;color:#6A6A6A;line-height:1.6;text-wrap:pretty\">{{ p }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;alertCap&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:3,&quot;max&quot;:9,&quot;section&quot;:&quot;Board behaviour&quot;},&quot;task01_promoVideo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;not started&quot;,&quot;in progress&quot;,&quot;complete&quot;],&quot;default&quot;:&quot;complete&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Build list · before applications open — 7 Aug&quot;},&quot;task02_h5InvitePage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;not started&quot;,&quot;in progress&quot;,&quot;complete&quot;],&quot;default&quot;:&quot;complete&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Build list · before applications open — 7 Aug&quot;},&quot;task03_inviteListPull&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;not started&quot;,&quot;in progress&quot;,&quot;complete&quot;],&quot;default&quot;:&quot;complete&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Build list · before applications open — 7 Aug&quot;},&quot;task04_h5LinksQa&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;not started&quot;,&quot;in progress&quot;,&quot;complete&quot;],&quot;default&quot;:&quot;complete&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Build list · before applications open — 7 Aug&quot;},&quot;task05_inFeedSetup&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;not started&quot;,&quot;in progress&quot;,&quot;complete&quot;],&quot;default&quot;:&quot;in progress&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Build list · before applications open — 7 Aug&quot;},&quot;task06_outreachComms&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;not started&quot;,&quot;in progress&quot;,&quot;complete&quot;],&quot;default&quot;:&quot;complete&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Build list · before applications open — 7 Aug&quot;},&quot;task07_bannerLive&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;not started&quot;,&quot;in progress&quot;,&quot;complete&quot;],&quot;default&quot;:&quot;complete&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Build list · before applications open — 7 Aug&quot;},&quot;task08_pushSchedule&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;not started&quot;,&quot;in progress&quot;,&quot;complete&quot;],&quot;default&quot;:&quot;in progress&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Build list · before applications open — 7 Aug&quot;},&quot;task09_budgetConfirmed&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;not started&quot;,&quot;in progress&quot;,&quot;complete&quot;],&quot;default&quot;:&quot;not started&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Build list · before phase launch — 20 Aug&quot;},&quot;task10_aocPageStaged&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;not started&quot;,&quot;in progress&quot;,&quot;complete&quot;],&quot;default&quot;:&quot;not started&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Build list · before phase launch — 20 Aug&quot;},&quot;task11_milestoneH5Live&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;not started&quot;,&quot;in progress&quot;,&quot;complete&quot;],&quot;default&quot;:&quot;not started&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Build list · before phase launch — 20 Aug&quot;}}\">\nclass Component extends DCLogic {\n  /* ================================================================\n     CONFIG BLOCK — the only part you edit by hand.\n     Everything else is read from the baked datasets below.\n     ================================================================ */\n  CONFIG = {\n    PHASES: [\n      { name: \"Phase 1\", startDate: \"2026-04-16\", endDate: \"2026-05-14\", applicationOpens: \"2026-04-01\", applicationCloses: \"2026-04-15\", transitionTarget: 4,   enrollmentTarget: 580, note: \"AI and human review\" },\n      { name: \"Phase 2\", startDate: \"2026-06-22\", endDate: \"2026-07-19\", applicationOpens: \"2026-06-08\", applicationCloses: \"2026-06-21\", transitionTarget: 12,  enrollmentTarget: 177 },\n      { name: \"Phase 3\", startDate: \"2026-07-20\", endDate: \"2026-08-19\", applicationOpens: \"2026-07-06\", applicationCloses: \"2026-07-19\", transitionTarget: 64,  enrollmentTarget: 285 },\n      { name: \"Phase 4\", startDate: \"2026-08-20\", endDate: \"2026-09-15\", applicationOpens: \"2026-08-07\", applicationCloses: \"2026-08-19\", transitionTarget: 100, enrollmentTarget: 310 },\n      { name: \"Phase 5\", startDate: \"2026-09-16\", endDate: \"2026-10-14\", applicationOpens: \"2026-09-05\", applicationCloses: \"2026-09-15\", transitionTarget: 108, enrollmentTarget: 165 }\n    ],\n\n    /* Cohort headcount. Phase 3 is read from the enrolled master list (see\n       ENROLLMENT below). Phases 1 and 2 can only be inferred from that list as\n       a lower bound, since creators who left are not on it. Set a phase here to\n       override the derived figure with a hand-entered one. */\n    ENROLLED: { \"Phase 1\": 3688, \"Phase 2\": 378, \"Phase 3\": 1143, \"Phase 4\": null, \"Phase 5\": null },\n\n    /* Outcome metrics. These are the primary measures and no attached file\n       carries them yet, so each value stays null and the snapshot prints\n       \"not yet measured\" in that slot rather than a zero. Fill a value and its\n       phase when the measurement lands. */\n    OUTCOMES: {\n      hcPostGrowth:       { value: null, phase: \"Phase 3\", n: null, target: \"4.4% target\", note: \"No post-level HC data supplied.\" },\n      milestoneCompletion:{ value: null, phase: \"Phase 4\", n: null, target: \"no target set\", note: \"Milestone campaign H5 and tracking due 19 Aug.\" },\n      transitionRate:     { value: null, phase: \"Phase 2\", n: 12,   target: \"64 transitions targeted (Phase 3)\", note: \"Every reviewed creator has one review. A second review is required before a transition can be detected.\" }\n    },\n\n    /* Phase 1 as originally published by the tier analysis: aggregate only.\n       Set enabled to false once a creator-level export covering Phase 1 exists.\n       An uploaded CSV containing Phase 1 replaces this automatically. */\n    PHASE1_AGGREGATE: {\n      enabled: true,\n      phase: \"Phase 1\",\n      totalStrikes: 8913,\n      tiers: { \"Non-PGC\": 3407, \"PGC 60\": 4401, \"PGC 80\": 1105 },\n      tierOrder: [\"PGC 80\", \"PGC 60\", \"Non-PGC\"]\n    },\n\n    /* Per-phase context for the strike analysis. Editable. \"shipped\" is what\n       went out that phase, \"note\" is free  read   {URL}?action=read\n         write  {URL}?action=write&task=8&status=on%20hold&note=...&who=Paul\n       held_since is set server-side on the transition into on hold and cleared\n       on the transition out. While this is null the board runs from the values\n       below and any change is session-only — the line above the list says so. */\n    STATUS_ENDPOINT: \"https://ecgp-status.vercel.app/api/status\",\n    WHO: \"Paul\",\n    POLL_SECONDS: 120,\n    NOTE_MAX: 300,\n    GATE_RISK_DAYS: 5,\n\n    /* Gates are dated groupings of tasks and are read from the tasks\n       themselves — never inferred from a due date, never hardcoded in the\n       render. Give a task a later gate_date and a new heading appears in date\n       order. Nothing else has to change. */\n    LAUNCH_ASSETS: [\n      { key: \"task01_promoVideo\", gateName: \"Before applications open\", gateDate: \"2026-08-07\", name: \"Phase 4 promo video updated with new dates\", owner: \"Vanessa Castro Chesterton\", dueDate: \"2026-08-03\", status: \"complete\", criticalPath: true },\n      { key: \"task02_h5InvitePage\", gateName: \"Before applications open\", gateDate: \"2026-08-07\", name: \"Phase 4 H5 invite page\", owner: \"Cici Luo\", dueDate: \"2026-08-04\", status: \"complete\", criticalPath: true },\n      { key: \"task03_inviteListPull\", gateName: \"Before applications open\", gateDate: \"2026-08-07\", name: \"Phase 4 invite list pull\", owner: \"Vanny Gong\", dueDate: \"2026-08-04\", status: \"complete\", criticalPath: true },\n      { key: \"task04_h5LinksQa\", gateName: \"Before applications open\", gateDate: \"2026-08-07\", name: \"All H5 links generated and QA'd on mobile\", owner: \"Rachelle Tran\", dueDate: \"2026-08-05\", status: \"complete\", criticalPath: true },\n      { key: \"task05_inFeedSetup\", gateName: \"Before applications open\", gateDate: \"2026-08-07\", name: \"In-feed campaign setup and asset upload\", owner: \"Philine Kresser\", dueDate: \"2026-08-05\", status: \"in progress\", criticalPath: false },\n      { key: \"task06_outreachComms\", gateName: \"Before applications open\", gateDate: \"2026-08-07\", name: \"Outreach comms ready for application\", owner: \"Rachelle Tran\", dueDate: \"2026-08-07\", status: \"complete\", criticalPath: true },\n      { key: \"task07_bannerLive\", gateName: \"Before applications open\", gateDate: \"2026-08-07\", name: \"In-feed and profile banner live\", owner: \"Cici Luo\", dueDate: \"2026-08-07\", status: \"complete\", criticalPath: true },\n      { key: \"task08_pushSchedule\", gateName: \"Before applications open\", gateDate: \"2026-08-07\", name: \"Push and in-app schedule confirmed (Aug 7-19)\", owner: \"Rachelle Tran\", dueDate: \"2026-08-07\", status: \"in progress\", criticalPath: false },\n      /* Milestone block, kept contiguous. Budget must be confirmed before the\n         AOC page is staged, so it stays immediately ahead of it. */\n      { key: \"task09_budgetConfirmed\", gateName: \"Before phase launch\", gateDate: \"2026-08-20\", name: \"Phase 4 milestone budget confirmed\", owner: \"Rachelle Tran\", dueDate: \"2026-08-05\", status: \"not started\", criticalPath: true },\n      { key: \"task10_aocPageStaged\", gateName: \"Before phase launch\", gateDate: \"2026-08-20\", name: \"Milestone AOC page staged and QA'd\", owner: \"Paul Ferrante\", dueDate: \"2026-08-06\", status: \"not started\", criticalPath: true },\n      { key: \"task11_milestoneH5Live\", gateName: \"Before phase launch\", gateDate: \"2026-08-20\", name: \"Milestone campaign H5 and tracking live\", owner: \"Paul Ferrante\", dueDate: \"2026-08-19\", status: \"not started\", criticalPath: true }\n    ]\n  };\n\n  /* ---- BAKED: PGC80 Program Creator Quality Review Tracker.xlsx → Submission Log ---- */\n  REVIEWS = [\n    { date: \"2026-07-03\", phase: \"Phase 2\", handle: \"ogilvietheblue\", vcs: 2, vps: 1, reviewer: \"Emily\", email: \"Sent\", feedback: \"- Adding multiple angles\\n- Add Animation / Special Effects\\n- Full sreen visuals (remove padding around images)\\n- Video Length (cut from 3 mins into 3 x 60 second videos to encourage completion)\" },\n    { date: \"2026-07-03\", phase: \"Phase 2\", handle: \"cubbiechats\", vcs: 2, vps: 1, reviewer: \"Emily\", email: \"Sent\", feedback: \"- Over-exposed lighting (blurs Point of Focus and reflects on plastic boxes in background)\\n- Post-production complexity: adding animated graphics, lower thirds or visual effects to demonstrate advanced editing skills\" },\n    { date: \"2026-07-03\", phase: \"Phase 2\", handle: \"beckabalderastexas\", vcs: 1, vps: 1, reviewer: \"Emily\", email: \"Sent\", feedback: \"- Greenscreen improvement\\n- Image overlays - padding & quality\\n- Fact Based Commentary\" },\n    { date: \"2026-07-03\", phase: \"Phase 2\", handle: \"moreandchismesdoramas\", vcs: 0, vps: 1, reviewer: \"Emily\", email: \"Sent\", feedback: \"- Remove Capcut logo at end\\n- Basic plot narration, add your own perspectives & analyis\\n- No caption, only hashtags used\\n- Clips & visuals: Remove padding & ensure consistent quality across all\" },\n    { date: \"2026-07-03\", phase: \"Phase 2\", handle: \"violetstattoos\", vcs: 2, vps: 2, reviewer: \"Emily\", email: \"Sent\", feedback: \"- BG Music & Voices: making sure music doesn't overpower\\n- Transitions between scenes\\n- Using Music & Sounds to add impact to storytelling\" },\n    { date: \"2026-07-03\", phase: \"Phase 2\", handle: \"juhsverse\", vcs: 1, vps: 1, reviewer: \"Emily\", email: \"Sent\", feedback: \"- Don't re-use the same clips over and over to increase video duration\\n- Add personal commentary / analysis\" },\n    { date: \"2026-07-08\", phase: \"Phase 2\", handle: \"featuringalex\", vcs: 2, vps: 2, reviewer: \"Paul\", email: \"Sent\", feedback: \"1. Adjust split screen - Ensure the split screen doesn't cut you out as the speaker; keep yourself visible throughout\\n2. Add more jump cuts - Create a quicker pace by cutting out non-essential information that doesn't contribute to the story (prevents viewer drop-off)\\n3. Include retention hooks - Add hooks throughout the video to maintain viewer engagement and keep them watching\" },\n    { date: \"2026-07-08\", phase: \"Phase 2\", handle: \"absolutecinemareview\", vcs: 2, vps: 2, reviewer: \"Paul\", email: \"Sent\", feedback: \"1. Add more facts and supporting points - Justify why each show is ranked where it is with concrete reasons\\n2. Include specific data points - Add ratings, viewership numbers, and award nominations for each show\\n3. Add an \\u201chonorable mentions\\u201d segment - Acknowledge near-top picks before revealing the final ranking\" },\n    { date: \"2026-07-08\", phase: \"Phase 2\", handle: \"https.unease\", vcs: 1, vps: 1, reviewer: \"Paul\", email: \"Sent\", feedback: \"1. Add professional transitions between scenes (smooth fades, matching cuts on beat).\\n2. Include beat-synced effects that enhance the energy of the edit.\\n3. Add text effects that are integrated into the visuals (not just overlaid).\" },\n    { date: \"2026-07-08\", phase: \"Phase 2\", handle: \"joshvsthewrld__\", vcs: 1, vps: 1, reviewer: \"Paul\", email: \"Sent\", feedback: \"1. Add specific data points - include box office numbers, exact release dates, or IMAX screen counts.\\n2. Provide deeper analysis - explain the business reasoning behind Marvel's decisions.\\n3. Add a visual hook in the first 3 seconds with text overlay introducing the topic.\\n4. Include a brief summary or conclusion at the end with a call-to-action.\" },\n    { date: \"2026-07-08\", phase: \"Phase 2\", handle: \"johnjonne\", vcs: 1, vps: 1, reviewer: \"Paul\", email: \"Sent\", feedback: \"1. Adjust split screen positioning - Ensure the split screen covers the full top portion of the video without leaving a bar at the top\\n2. Strengthen the hook - Currently it mentions IMAX and Marvel in disagreement; add more context that alludes to what the dispute is about to draw viewers in\\n3. Include add nst make = (phase, n, offset, bias) => {\n      for (let i = 0; i < n; i++) {\n        const handle = \"sample_creator_\" + (offset + i);\n        const tier = tiers[Math.floor(rnd() * 3)];\n        const k = 1 + Math.floor(rnd() * 4);\n        for (let s = 0; s < k; s++) {\n          let idx = Math.floor(rnd() * cats.length);\n          if (bias && rnd() < 0.3) idx = Math.floor(rnd() * 3);\n          rows.push({ handle, phase, tier, cat: cats[idx], date: null, demo: true });\n        }\n      }\n    };\n    make(\"Phase 2\", 78, 1, false);\n    make(\"Phase 3\", 96, 40, true);\n    this._demoCache = rows;\n    return rows;\n  }\n  toggleDemo = () => {\n    if (this.state.strikeRows && this.state.strikeRows.length) return;\n    this.setState({ demo: !this.state.demo });\n  };\n\n  loadStrikes = e => {\n    const f = e.target.files && e.target.files[0];\n    if (!f) return;\n    const fr = new FileReader();\n    fr.onload = () => {\n      const rows = this.csv(fr.result).map(r => ({\n        handle: String(this.pick(r, [\"handle\", \"tiktok handle\", \"creator\"])).replace(/^@+/, \"\").trim().toLowerCase(),\n        phase: this.phaseLabel(this.pick(r, [\"phase\"])),\n        tier: String(this.pick(r, [\"pgc_tier\", \"pgc tier\", \"tier\"])).trim(),\n        cat: String(this.pick(r, [\"strike_category\", \"strike category\", \"category\"])).trim(),\n        date: this.pd(this.pick(r, [\"date\"]))\n      })).filter(r => r.handle && r.phase && r.cat);\n      /* Real data permanently ends demo mode. */\n      this.setState({ strikeRows: rows, strikeFile: f.name, strikePhase: null, comparePhase: null, demo: false, demoLocked: true });\n    };\n    fr.readAsText(f);\n  };\n\n  setSearch = e => this.setState({ search: e.target.value });\n  setDateOverride = e => this.setState({ dateStr: e.target.value });\n  toggleDateOverride = () => this.setState({ showDate: !this.state.showDate });\n  closeDetail = () => this.setState({ sel: null });\n  openSnapshot = () => this.setState he comparison phase's overall rate, since they have no earlier record of their own.\";\n\n      /* ---- Panel 3: concentration ---- */\n      const conc = curCats.map(c => {\n        const per = {};\n        curRows.filter(r => r.cat === c).forEach(r => per[r.handle] = (per[r.handle] || 0) + 1);\n        const counts = Object.values(per);\n        const affected = counts.length, share = curN ? affected / curN : 0;\n        const med = this.median(counts), mean = counts.length ? counts.reduce((s, x) => s + x, 0) / counts.length : 0;\n        return { cat: c, affected, share, med, mean, skew: med > 0 && mean > med * 2 };\n      }).sort((a, b) => b.share - a.share);\n      sa.concentration = conc.map(r => ({\n        cat: r.cat, pct: r.share * 100, share: Math.round(r.share * 100) + \"%\",\n        affected: this.n(r.affected) + \" of \" + this.n(curN),\n        med: r.med % 1 === 0 ? String(r.med) : r.med.toFixed(1),\n        mean: r.mean.toFixed(1),\n        label: r.share >= 0.5 ? \"Widespread\" : r.share >= 0.15 ? \"Targeted\" : \"Rare\",\n        labelColor: r.share >= 0.5 ? RED : r.share >= 0.15 ? AMB : DIM,\n        barColor: r.share >= 0.5 ? RED : r.share >= 0.15 ? AMB : \"#2E7D78\",\n        hasSkew: r.skew, skewNote: r.skew ? \"few carry most\" : \"\",\n        shareTip: \"Share: the percentage of creators flagged for this theme at least once. \" + this.n(r.affected) + \" of \" + this.n(curN) + \" creators in \" + curP + \".\",\n        medTip: \"Typical: the median number of strikes among creators who were flagged for this theme.\",\n        meanTip: \"Average: the mean, which can be pulled up by a small number of heavy cases.\",\n        labelTip: r.share >= 0.5 ? \"Widespread: half the cohort or more is affected.\" : r.share >= 0.15 ? \"Targeted: between 15% and 49% of the cohort is affected.\" : \"Rare: under 15% of the cohort is affected.\"\n      }));\n      sa.hasConc = sa.concentration.length > 0 && !curAgg;\n      sa.concBlocked = curAgg;\n      sa.concFootnote = \"Share is the percentage of the reviewed cohort flagged at least once — the denominator is every creator reviewed in \" + curP + \", \"\n        + (curZero ? \"including the \" + this.n(curZero) + \" who drew no strike at all. \" : \"not only those with strikes. \")\n        + \"Typical is the median strikes among the flagged creators, average is the mean. Where the two diverge, a few creators carry most of the volume.\";\n      sa.concAdvice = \"Widespread themes belong in curriculum, because most of the cohort hits them. Targeted themes are better handled with direct outreach to the affected creators, since the majority are already clear of them.\";\n\n      /* ---- Panel 4: theme history ---- */\n      const aggThemes = agg ? (tf === \"__all\" ? agg.themes : (agg.perTier[tf] || {})) : {};\n      const histCats = [...new Set(SR.filter(inTier).map(r => r.cat).concat(Object.keys(aggThemes)))];\n      const phaseTotals = {};\n      allPhases.forEach(p => phaseTotals[p] = cohortOf(p).size);\n      const histData = histCats.map(c => ({\n        cat: c,\n        vals: allPhases.map(p => {\n          if (isAggPhase(p)) {\n            const hits = aggThemes[c] || 0;\n            return { phase: p, present: hits > 0, agg: true, v: hits };\n          }\n          const rws = rowsOf(p), n = phaseTotals[p];\n          const hits = rws.filter(r => r.cat === c).length;\n          return { phase: p, present: hits > 0, agg: false, v: n ? hits / n : 0 };\n        })\n      })).sort((a, b) => {\n        const last = r => { const x = r.vals[r.vals.length - 1]; return x.agg ? 0 : x.v; };\n        return last(b) - last(a);\n      });\n      sa.histPhases = allPhases.map(p => ({ name: p + (isAggPhase(p) ? \" · aggregate\" : \"\"),\n        n: isAggPhase(p) ? \"total strikes\" : \"n = \" + this.n(phaseTotals[p]) + \" · per creator\" }));\n      sa.history = histData.map(r => ({\n        cat: r.cat,\n        cells: r.vals.map((x, i) => {\n          const prev = i > 0 ? r.v .n(ctx.videosReviewed) + \" videos reviewed\" : \"videos reviewed not configured\";\n      sa.ctxNote = ctx.note || \"No note recorded for \" + curP + \". Add one in CONFIG.PHASE_CONTEXT so this phase explains itself later.\";\n      sa.ctxAdjacent = sa.hasTags && cmpP\n        ? \"Shipped in \" + curP + \", and the movements shown above, are two separate facts placed side by side. Nothing here establishes that one caused the other.\"\n        : \"\";\n    } else {\n      Object.assign(sa, { phaseOptions: [], compareOptions: [], tierOptions: [], videoRateOptions: [],\n        tierAvailable: false, tierUnavailable: false, tierNote: \"\",\n        canCompare: false, noCompare: false, compareNote: \"\", curPhase: \"\", cmpPhase: \"\", tierLabel: \"\",\n        curIsAgg: false, aggBlocked: false, aggBlockNote: \"\", concBlocked: false, whoBlocked: false, moveBlocked: false,\n        hasTierSplit: false, tierSplit: [], tierThemes: [], tierTotalLabel: \"\", tierSplitNote: \"\",\n        headline: \"\", headlineTip: \"\", subhead: \"\", hasVideoRate: false, normLabel: \"\",\n        movements: [], hasMovements: false, mapLine: \"\", hasCatWarning: false, catWarning: \"\",\n        retN: 0, newN: 0, retLine: \"\", retTip: \"\", smallCohort: false, smallCohortNote: \"\",\n        whoOptions: [], whoRows: [], hasWho: false, whoFootnote: \"\",\n        concentration: [], hasConc: false, concFootnote: \"\", concAdvice: \"\",\n        histPhases: [], history: [], hasHistory: false, histNote: \"\",\n        ctxPhase: \"\", ctxTags: [], hasTags: false, ctxCreators: \"\", ctxVideos: \"\", ctxNote: \"\", ctxAdjacent: \"\" });\n    }\n\n    /* ===================== PHASE 2 REVIEW OUTCOMES =====================\n       From the video-level review: one row per video, so pass/fail, severity\n       and content format are all available here and nowhere else. Every figure\n       is a straight count from the export — no modelling. */\n    const D2 = window.ECGP_PHASE2;\n    const p2 = { has: !!(D2 && D2.videos) };\n    if (p2.has) {\n      const V = D2.videos, oc = D2.outcome || {};\n      const pass = oc[\"Pass\"] || 0, fail = oc[\"Fail\"] || 0, hrv = oc[\"Needs Human Review\"] || 0;\n      const strikeTotal = (D2.strikes || []).reduce((s, x) => s + x.n, 0);\n      const clean = (D2.hist || {})[\"0\"] || 0;\n      p2.phase = D2.phase;\n      p2.label = D2.phase + \" · video-level review\";\n      p2.passRate = this.pct(pass, V);\n      p2.passColor = pass / V >= 0.5 ? CY : pass / V >= 0.25 ? AMB : RED;\n      p2.passSub = this.n(pass) + \" of \" + this.n(V) + \" videos passed\";\n      p2.headline = this.n(V) + \" videos · \" + this.n(D2.creators.length) + \" creators · \" + this.n(strikeTotal) + \" strikes\";\n      p2.perVideo = (strikeTotal / V).toFixed(2);\n      p2.cleanLine = this.n(clean) + \" videos (\" + this.pct(clean, V) + \") drew no strike at all.\";\n\n      p2.outcomes = [\n        { name: \"Fail\", v: fail, color: RED },\n        { name: \"Pass\", v: pass, color: CY },\n        { name: \"Needs human review\", v: hrv, color: AMB }\n      ].map(x => ({ name: x.name, color: x.color, pct: (x.v / V) * 100,\n        legend: x.name + \" \" + this.n(x.v) + \" · \" + this.pct(x.v, V),\n        inBar: x.v / V >= 0.06 ? this.pct(x.v, V) : \"\" }));\n\n      const SEVC = { \"Low\": \"#2E7D78\", \"Medium\": AMB, \"High\": RED, \"Auto-fail\": \"#B0003A\", \"Human review\": \"#8A8A8A\" };\n      const sevOrder = [\"Low\", \"Medium\", \"High\", \"Auto-fail\", \"Human review\"];\n      const sevTot = sevOrder.reduce((s, k) => s + ((D2.sev || {})[k] || 0), 0) || 1;\n      p2.sev = sevOrder.filter(k => (D2.sev || {})[k]).map(k => {\n        const v = D2.sev[k];\n        return { name: k, color: SEVC[k], pct: (v / sevTot) * 100,\n          legend: k + \" \" + this.n(v) + \" · \" + this.pct(v, sevTot),\n          inBar: v / sevTot >= 0.07 ? this.pct(v, sevTot) : \"\",\n          title: k + \": \" + this.n(v) + \" strikes\" };\n      });\n      p2.sevNote = \"Auto-fail and human-review are outcomes rather than severities, and the export puts them in the same field. An auto-fail strike ends the review on its own; low and medium severity strikes only fail a video in combination.\";\n\n      const catTot = Object.values(D2.cat || {}).reduce((s, v) => s + v, 0) || 1;\n      const CATC = { \"Content & Engagement\": RED, \"Technical Production\": AMB, \"Automatic Failure\": \"#B0003A\", \"Human Review Needed\": \"#8A8A8A\" };\n      p2.cats = Object.keys(D2.cat || {}).sort((a, b) => D2.cat[b] - D2.cat[a]).map(k => ({\n        name: k, count: this.n(D2.cat[k]), share: this.pct(D2.cat[k], catTot),\n        color: CATC[k] || DIM, pct: (D2.cat[k] / catTot) * 100,\n        perVideo: (D2.cat[k] / V).toFixed(2)\n      }));\n\n      /* Format table. Pass rate by content format is the one lever visible in\n         this export that is not about an individual creator. */\n      const overall = pass / V;\n      p2.formats = Object.keys(D2.format || {})\n        .sort((a, b) => D2.format[b] - D2.format[a])\n        .map(k => {\n          const n2 = D2.format[k], fo = (D2.fmtOutcome || {})[k] || {};\n          const pr = n2 ? (fo[\"Pass\"] || 0) / n2 : 0;\n          const gap = pr - overall;\n          const thin = n2 < 60;\n          return { name: k, videos: this.n(n2), share: this.pct(n2, V),\n            passRate: Math.round(pr * 100) + \"%\",\n            passColor: thin ? DIM : pr >= overall * 1.5 ? CY : pr <= overall * 0.5 ? RED : \"#FFFFFF\",\n            barPct: Math.min(100, pr * 200), barColor: thin ? \"#3A3A3A\" : pr >= overall * 1.5 ? CY : pr <= overall * 0.5 ? RED : AMB,\n            gap: thin ? \"sample too thin\" : (gap > 0 ? \"+\" : gap < 0 ? \"−\" : \"\") + Math.round(Math.abs(gap) * 100) + \" pts\",\n            gapColor: thin ? \"#5A5A5A\" : Math.abs(gap) < 0.03 ? DIM : gap > 0 ? CY : RED,\n            title: k + \": \" + this.n(fo[\"Pass\"] || 0) + \" passed of \" + this.n(n2) + \" reviewed\" };\n        });\n      p2.formatNote = \"Pass rate against the \" + Math.round(overall * 100) + \"% programme average. Formats under 60 reviewed videos are shown but not read — the sample is too thin to act on. Bars are scaled to twice the average, so a full bar is roughly double.\";\n\n      const mal = D2.malformedFormat || 0;\n      p2.hasMalformed = mal > 0;\n      p2.malformedNote = this.n(mal) + \" of \" + this.n(V) + \" rows carry a malformed content-format value — feedback-email text, a bare \\\"Fail\\\", a video title — so they are excluded from the format table above. They are still counted in every outcome, severity and strike figure, which read from other columns. Worth fixing upstream before Phase 3.\";\n\n      p2.topStrikes = (D2.strikes || []).slice(0, 12).map(s => {\n        const hi = (s.sev[\"High\"] || 0) + (s.sev[\"Auto-fail\"] || 0);\n        return { nm: s.nm, cat: s.cat, count: this.n(s.n),\n          catColor: CATC[s.cat] || DIM,\n          perVideo: (s.n / V).toFixed(2),\n          hiShare: Math.round((hi / s.n) * 100) + \"%\",\n          hiColor: hi / s.n >= 0.4 ? RED : hi / s.n >= 0.2 ? AMB : DIM,\n          conf: s.conf.toFixed(2),\n          barPct: Math.max(2, (s.n / D2.strikes[0].n) * 100),\n          title: s.nm + \" · \" + this.n(s.n) + \" strikes · \" + s.cat + \" · mean model confidence \" + s.conf.toFixed(2) };\n      });\n      p2.strikeNote = \"Severe share is the proportion of a theme's strikes graded high severity or auto-fail. Confidence is the reviewer model's own mean confidence for that theme — a low figure is a signal to spot-check the calls, not to discount them. \"\n        + \"The \" + this.n(strikeTotal) + \" total counts every strike object in the video-level review; the handle export's own Total Strikes column sums to \" + this.n(strikeTotal - ((D2.cat || {})[\"Human Review Needed\"] || 0)) + \" because it leaves out the \" + this.n((D2.cat || {})[\"Human Review Needed\"] || 0) + \" human-review strikes. Same data, two conventions.\"; \"scores\", label: \"VCS / VPS\", align: \"left\" },\n      { k: \"daysSince\", label: \"Days since review\", align: \"right\" }\n    ];\n    const creatorCols = colDef.map(c => ({ label: c.label + (S.sortKey === c.k ? (S.sortDir === 1 ? \" ↑\" : \" ↓\") : \"\"), align: c.align,\n      color: S.sortKey === c.k ? CY : DIM,\n      onClick: () => this.setState({ sortKey: c.k, sortDir: S.sortKey === c.k ? -S.sortDir : -1 }) }));\n    const creatorRows = sorted.map((c, i) => ({\n      handle: \"@\" + c.handle, submissions: this.n(c.submissions), startLevel: c.startLevel,\n      currentLevel: c.currentLevel, curColor: this.lvlColor(c.currentLevel),\n      movement: c.submissions < 2 ? \"needs 2nd review\" : c.move > 0 ? \"up \" + c.move : c.move < 0 ? \"down \" + Math.abs(c.move) : \"flat\",\n      moveColor: c.submissions < 2 ? \"#5A5A5A\" : c.move > 0 ? CY : c.move < 0 ? RED : DIM,\n      scores: c.vcs + \" / \" + c.vps,\n      daysSince: c.daysSince, staleColor: c.daysSince > 21 ? AMB : DIM,\n      bg: i % 2 ? \"#141414\" : \"#161616\",\n      onClick: () => this.setState({ sel: c.handle })\n    }));\n    const creatorTitle = this.n(creators.length) + \" reviewed creators · \" + reviewPhase + \" · \" + this.fmtY(this.pd(\"2026-07-03\")) + \" and \" + this.fmtY(this.pd(\"2026-07-08\"));\n    const creatorFooter = \"Showing \" + creatorRows.length + \" of \" + this.n(creators.length) + \". Click a row for scores and the feedback that was sent. Only creators with a logged review appear here.\";\n\n    /* detail */\n    const selC = S.sel ? creators.find(c => c.handle === S.sel) : null;\n    let detail = { handle: \"\", meta: \"\", movement: \"\", moveColor: DIM, scores: [], feedback: \"\", feedbackMeta: \"\", strikeMissing: \"\" };\n    if (selC) {\n      const last = selC.rows[selC.rows.length - 1];\n      detail = {\n        handle: \"@\" + selC.handle,\n        meta: selC.submissions + \" review\" + (selC.submissions === 1 ? \"\" : \"s\") + \" · \" + selC.phase + \" · feedback \" + last.email.toLowerCase(),\n        movement: selC.submissions < 2 ? selC.startLevel + \" on first review · a second review is needed before movement can be read\" : selC.startLevel + \" → \" + selC.currentLevel,\n        moveColor: selC.submissions < 2 ? DIM : selC.move > 0 ? CY : selC.move < 0 ? RED : DIM,\n        scores: selC.rows.map(r => { const l = this.level(r.vcs, r.vps);\n          return { date: this.fmtY(this.pd(r.date)), reviewer: r.reviewer, vcs: r.vcs, vps: r.vps,\n            vcsPct: Math.round((r.vcs / 2) * 100), vpsPct: Math.round((r.vps / 2) * 100),\n            lvl: l, lvlColor: this.lvlColor(l) }; }),\n        feedback: last.feedback,\n        feedbackMeta: \"Reviewer \" + last.reviewer + \" · \" + this.fmtY(this.pd(last.date)) + \" · email \" + last.email.toLowerCase(),\n        strikeMissing: \"Not available per creator. The strike export is aggregated by category, so it carries no handles. Supply the row-level strike export to fill this in.\"\n      };\n    }\n\n    /* snapshot — four bands. Every figure carries its phase and its n inline,\n       and no number aggregates across phases. */\n    const rosterPhase = EN.phase, rosterFile = EN.unique;\n\n    /* Freshness derives from the newest review row, never hardcoded. */\n    const daysBehind = this.days(newest, t);\n    const wksBehind = Math.round(daysBehind / 7);\n    const freshness = \"Data as of \" + this.fmtY(newest) + \" · \" + wksBehind + \" week\" + (wksBehind === 1 ? \"\" : \"s\") + \" behind current.\";\n\n    /* BAND — outcomes. Primary metrics; an empty slot is information. */\n    const O = this.CONFIG.OUTCOMES;\n    const outcomeSlot = (label, o, fmtVal) => {\n      const measured = o.value !== null && o.value !== undefined;\n      return { label: label + \" · \" + o.phase + (o.n ? \" · n = \" + this.n(o.n) : \" · n not established\"),\n        value: measured ? fmtVal(o.value) : \"not yet measured\",\n        size: measured ? \"30px\" : \"15px\",\n        color: measured ? CY : \"#6A6A6A\",\n        target: o.target, note: o.note };\n    };\n    const outcomes = [\n      outcomeSlot(\"HC post growth\", O.hcPostGrowth, v => v + \"%\"),\n      outcomeSlot(\"Milestone completion\", O.milestoneCompletion, v => v + \"%\"),\n      outcomeSlot(\"Transition rate\", O.transitionRate, v => v + \"%\")\n    ];\n\n    /* BAND — enrollment. */\n    const mixColors = { \"New\": CY, \"Graduate\": \"#7FCFCB\", \"Not recorded\": \"#3A3A3A\" };\n    const snapMix = [\n      { name: \"New\", v: EN.isNew }, { name: \"Graduate\", v: EN.graduate }, { name: \"Not recorded\", v: EN.unknownType }\n    ].filter(s => s.v > 0).map(s => ({\n      color: mixColors[s.name], pct: (s.v / mixTotal) * 100,\n      inBar: s.v / mixTotal > 0.1 ? this.pct(s.v, mixTotal) : \"\",\n      legend: s.name + \" \" + this.n(s.v) + \" · \" + this.pct(s.v, mixTotal)\n    }));\n\n    /* BAND — quality mix. Promoted to a chart only at n >= 100. */\n    const qN = den, qPromoted = qN >= 100;\n    const qCounts = { \"PGC 80\": 0, \"PGC 60\": 0, \"Non-PGC\": 0 };\n    creators.forEach(c => { if (qCounts[c.currentLevel] !== undefined) qCounts[c.currentLevel]++; });\n    const qDefs = [\n      { key: \"PGC 80\", label: \"PGC 80\", color: CY, textColor: \"#00302E\" },\n      { key: \"PGC 60\", label: \"PGC 60\", color: \"#2E7D78\", textColor: \"#FFFFFF\" },\n      { key: \"Non-PGC\", label: \"below 60\", color: RED, textColor: \"#FFFFFF\" }\n    ];\n    const quality = qDefs.map(d => {\n      const v = qCounts[d.key], share = qN ? v / qN : 0;\n      return { color: d.color, textColor: d.textColor, pct: share * 100,\n        inBar: share >= 0.07 ? this.n(v) : \"\",\n        legend: d.label + \" \" + this.n(v) + \" · \" + (qN ? Math.round(share * 100) : 0) + \"%\" };\n    }).filter(q => q.pct > 0);\n    const qualityInline = qDefs.map(d => d.label + \" \" + this.n(qCounts[d.key]) + \" (\" + this.pct(qCounts[d.key], qN) + \")\").join(\", \");\n    const qualityCoverage = reviewPhase + \" · n = \" + this.n(qN) + \" of \" + this.n(roster) + \" \" + rosterPhase + \" roster · \" + this.pct(qN, roster) + \" of roster\";\n\n    /* BAND — strike concentration by tier. Rate is primary; raw counts stay\n       secondary and never rank the tiers. */\n    const tierAccent = { \"PGC 80\": CY, \"PGC 60\": \"#7FCFCB\", \"Non-PGC\": \"#8A8A8A\" };\n    const tierOrder = [\"PGC 80\", \"PGC 60\", \"Non-PGC\"];\n    const tierCount = nm => (this.TIERS.find(r => r[0] === nm) || [nm, 0])[1];\n    const themeRate = (nm, vids) => this.THEMES\n      .map(th => ({ theme: th.theme, v: (th.src[nm] || []).reduce((s, l) => { const hit = this.TIER_TOP[nm].find(r => r[0] === l); return s + (hit ? hit[1] : 0); }, 0) }))\n      .filter(x => x.v > 0).sort((a, b) => b.v - a.v).slice(0, 2)\n      .map((x, i) => (i + 1) + \". \" + x.theme + \" \" + (x.v / vids).toFixed(2)).join(\"  ·  \");\n    const snapTiers = tierOrder.map(nm => {\n      const strikes = tierCount(nm), vids = this.CONFIG.TIER_VIDEOS_REVIEWED[nm];\n      const hasRate = vids !== null && vids !== undefined && vids > 0;\n      return { name: nm + \" · Phase 1\", accent: tierAccent[nm],\n        rate: hasRate ? (strikes / vids).toFixed(2) : \"rate unavailable, counts not comparable across tiers\",\n        rateSize: hasRate ? \"30px\" : \"12px\",\n        rateColor: hasRate ? CY : \"#6A6A6A\",\n        size: hasRate ? this.n(vids) + \" videos reviewed\" : \"not yet measured\",\n        sizeLabel: hasRate ? \"tier size · n = \" + this.n(vids) : \"tier size, creators · not supplied\",\n        raw: this.n(strikes) + \" strikes · \" + this.pct(strikes, tierTotal) + \" of all strikes (n = \" + this.n(tierTotal) + \")\",\n        themes: hasRate ? themeRate(nm, vids) : \"Top themes suppressed: ranking them on raw counts would mislead.\" };\n    });\n    const anyRate = tierOrder.some(nm => this.CONFIG.TIER_VIDEOS_REVIEWED[nm]);\n    const snapTierNote = anyRate\n      ? \"Rate is strikes per video reviewed within the tier. Raw counts are shown for reference only.\"\n      : \"Videos reviewed per tier is not published in the tier analysis, so no per-tier rate can be computed and the tiers cannot be compared. Raw counts below track tier size, not performance. Supply videos reviewed per tier to unlock the rate and the top themes.\";\n\n    const footnotes = [];\n    if (!qPromoted) footnotes.push(\"Quality mix · \" + reviewPhase + \" · n = \" + this.n(qN) + \" of \" + this.n(roster) + \" roster, indicative only — \" + qualityInline + \".\");\n    if (roster !== rosterFile) footnotes.push(\"Sources disagree on the \" + rosterPhase + \" roster: \" + this.n(roster) + \" (team confirmed) and \" + this.n(rosterFile) + \" (\" + EN.file + \", deduplicated). Both are shown rather than one being chosen.\");\n\n    const snap = {\n      freshness: freshness,\n      outcomes: outcomes,\n      enrolled: this.n(roster), enrolledOf: \"of \" + this.n(p3t) + \" target · \" + rosterPhase + \" · n = \" + this.n(roster),\n      enrolledPct: Math.round((roster / p3t) * 100) + \"%\",\n      mix: snapMix,\n      targetPolicy: \"Targets are set at quarter start and held for the quarter. Variance reflects intake volume, not target revision.\",\n      qualityPromoted: qPromoted, quality: quality, qualityCoverage: qualityCoverage,\n      tiers: snapTiers, tierNote: snapTierNote,\n      hasFootnotes: footnotes.length > 0, footnotes: footnotes,\n      provenance: [\n        \"Enrollment: \" + EN.file + \" · \" + rosterPhase + \" · n = \" + this.n(roster) + \".\",\n        \"Quality mix and transition rate: PGC80 Program Creator Quality Review Tracker, Submission Log · \" + reviewPhase + \" · n = \" + this.n(this.REVIEWS.length) + \" videos, \" + this.n(den) + \" creators.\",\n        \"Strike concentration: ECGP Phase 1 Tier Analysis · Phase 1 · n = \" + this.n(tierTotal) + \" strikes. Themes normalise two strike vocabularies across tiers.\",\n        \"Each band draws on the phase named beside it. No figure aggregates across phases. Internal only, not for external distribution. Board date \" + this.fmtY(t) + \".\"\n      ]\n    };\n\n    /* sources */\n    const sources = [\n      { file: \"PGC80 Program Creator Quality Review Tracker.xlsx · Submission Log\", powers: \"Creator table, levels, movement, transitions, feedback drawer\", scope: this.REVIEWS.length + \" rows · \" + den + \" creators\", state: \"baked in\", color: CY },\n      { file: \"Creator-level strike export (handle, phase, pgc_tier, strike_category, date)\", powers: \"All five strike analysis panels: movements, who changed, concentration, theme history, phase context\", scope: sa.has ? sa.file + \" · \" + this.n((S.strikeRows || []).length) + \" rows\" : \"not loaded this session\", state: sa.has ? \"loaded\" : \"awaiting file\", color: sa.has ? CY : AMB },\n      { file: \"ECGP Phase 1 Test 2 Strike Category Analysis.xlsx\", powers: \"Snapshot card only. Aggregated by category, so it carries no handles and cannot drive the strike panels\", scope: this.STRIKES.length + \" categories · \" + this.n(totalStrikes) + \" strikes\", state: \"baked in\", color: DIM },\n      { file: \"ECGP Phase 1 Tier Analysis.pdf\", powers: \"Snapshot card tier band only\", scope: \"3 tiers · \" + this.n(tierTotal) + \" strikes\", state: \"baked in\", color: DIM },\n      { file: this.ENROLLMENT.file, powers: \"Phase 3 roster composition and review coverage\", scope: this.n(this.ENROLLMENT.rows) + \" rows · roster confirmed at \" + this.n(this.CONFIG.ENROLLED[this.ENROLLMENT.phase]), state: \"baked in\", color: CY },\n      { file: \"Enrollment actuals and targets per phase\", powers: \"The program size chart\", scope: \"entered in CONFIG.ENROLLED\", state: \"set for 1–3\", color: CY }\n    ];\n\n    return {\n      locked: !S.unlocked, pwVal: S.pwVal, pwErr: S.pwErr, nameVal: S.nameVal, whoLabel: this.who(),\n      onNameInput: e => this.setState({ nameVal: e.target.value, pwErr: \"\" }),\n      onPwInput: e => this.setState({ pwVal: e.target.value, pwErr: \"\" }),\n      onPwKey: e => { if (e.key === \"Enter\") this.tryUnlock(); },\n      onUnlock: () => this.tryUnlock(),\n      phasePillLabel: cur.phase.name + \" · \" + cur.state, phasePillColor: cur.state === \"live\" ? CY : cur.state === \"closed\" ? DIM : AMB,\n      boardDate: this.fmtY(t), showDate: S.showDate, dateStr: S.dateStr,\n      toggleDateOverride: this.toggleDateOverride, setDateOverride: this.setDateOverride,\n      alerts, alertsMore: A.length > alerts.length ? (A.length - alerts.length) + \" more alert\" + (A.length - alerts.length === 1 ? \"\" : \"s\") + \" not shown\" : \"\",\n      alertsClear, z2: this.zone2(), z3: this.zone3(),\n      countdowns, launchSections, launchTitle, pendingLine, pendingColor: pendingColorV,\n      syncLine, hasSync: !!syncLine, draftNote: S.draftNote,\n      changeNote: this.changeNote, commitNote: this.commitNote, noteKey: this.noteKey,\n      sizeBars, sizeNote, sizeHeadline, mixLabel, mixSegs, mixNote,\n      dist, prevDist, hasPrevDist: prevDist.segs.length > 0,\n      hasSingleReview: singles > 0, singleReviewLine,\n      movementTitle, movementNote,\n      sa, p2, loadStrikes: this.loadStrikes,\n      transValue: this.n(transitioned), transOf: \"of \" + this.n(target) + \" target\", transPct: target ? Math.min(100, Math.round((transitioned / target) * 100)) : 0,\n      transColor, transLine, transNote,\n      search: S.search, setSearch: this.setSearch, creatorTitle, creatorCols, creatorRows, creatorFooter,\n      detailOpen: !!selC, detail, closeDetail: this.closeDetail,\n      sources, snapOpen: S.snapOpen, snap, snapRef: this.snapRef, snapStatus: S.snapStatus,\n      openSnapshot: this.openSnapshot, closeSnapshot: this.closeSnapshot, downloadSnapshot: this.downloadSnapshot\n    };\n  }\n}\n<\u002Fscript>\n\n      <div style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#8A8A8A\">\n<\u002Fdiv><\u002Fbody><\u002Fhtml>"
